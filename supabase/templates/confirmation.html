<!doctype html>
<html>
  <body style="margin:0;background:#fbf8f3;font-family:Arial,Helvetica,sans-serif;color:#2a2826">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf8f3;padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;padding:40px">
            <tr><td style="font-family:Georgia,serif;font-size:28px;letter-spacing:8px;text-align:center">AURAQ</td></tr>
            <tr><td style="padding-top:32px;font-family:Georgia,serif;font-size:24px">Confirm your email</td></tr>
            <tr><td style="padding-top:12px;font-size:15px;line-height:1.6;color:#57524c">Welcome to AURAQ. Please confirm your email address to activate your account.</td></tr>
            <tr>
              <td style="padding-top:28px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account"
                   style="display:inline-block;background:#2a2826;color:#fbf8f3;text-decoration:none;padding:14px 28px;font-size:13px;letter-spacing:2px;text-transform:uppercase">Confirm email</a>
              </td>
            </tr>
            <tr><td style="padding-top:28px;font-size:12px;color:#736c64">If you didn’t request this, you can safely ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
